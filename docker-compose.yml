services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: carnaticidx
      POSTGRES_USER: gohitha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gohitha -d carnaticidx"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URI: postgresql://gohitha:${POSTGRES_PASSWORD}@db:5432/carnaticidx
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
